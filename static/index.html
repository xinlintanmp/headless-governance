<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mixpanel Governance Agent</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #6b7280; --line: #e5e7eb;
    --panel: #f9fafb; --accent: #4f46e5; --warn: #b45309; --warn-bg: #fffbeb;
    --danger: #b91c1c; --ok: #047857;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --fg: #e8e8ea; --muted: #9ca3af; --line: #272a31;
      --panel: #171a20; --accent: #818cf8; --warn: #fbbf24; --warn-bg: #2a2314;
      --danger: #f87171; --ok: #34d399;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.6 ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 12px 16px; border-bottom: 1px solid var(--line);
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .meta { color: var(--muted); font-size: 13px; }
  header .spacer { flex: 1; }
  button {
    font: inherit; font-size: 13px; padding: 5px 11px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel);
    color: var(--fg); border-radius: 6px;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  #log { flex: 1; overflow-y: auto; padding: 20px 16px; }
  .wrap { max-width: 780px; margin: 0 auto; }
  .msg { margin-bottom: 20px; }
  .msg.user .body {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 13px; white-space: pre-wrap;
  }
  .msg .who {
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin-bottom: 5px;
  }
  .msg.agent .body { white-space: pre-wrap; }
  .tool {
    font-size: 13px; color: var(--muted); font-family: ui-monospace, monospace;
    padding: 2px 0;
  }
  .result { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .err { color: var(--danger); }
  .approval {
    border: 1px solid var(--warn); background: var(--warn-bg);
    border-radius: 10px; padding: 14px; margin: 14px 0;
  }
  .approval h3 { margin: 0 0 8px; font-size: 14px; color: var(--warn); }
  .approval table { border-collapse: collapse; font-size: 13px; margin-bottom: 12px; }
  .approval td { padding: 3px 14px 3px 0; vertical-align: top; }
  .approval td.k { color: var(--muted); font-family: ui-monospace, monospace; }
  .approval .danger { color: var(--danger); font-weight: 600; }
  .approval .actions { display: flex; gap: 8px; }
  .approval button.yes { border-color: var(--ok); color: var(--ok); }
  .approval button.no { border-color: var(--danger); color: var(--danger); }
  .approval.settled { opacity: .65; }
  footer { border-top: 1px solid var(--line); padding: 12px 16px; }
  form { max-width: 780px; margin: 0 auto; display: flex; gap: 8px; }
  textarea {
    flex: 1; font: inherit; padding: 9px 11px; resize: none;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--fg); min-height: 42px; max-height: 180px;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  dialog {
    border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
    color: var(--fg); max-width: 640px; width: 90vw; padding: 18px;
  }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog pre { white-space: pre-wrap; font-size: 13px; max-height: 60vh; overflow: auto; }
  @media (max-width: 600px) { #log, header, footer { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<header>
  <h1>Mixpanel Governance</h1>
  <span class="meta" id="meta">connecting…</span>
  <span class="spacer"></span>
  <button id="btn-context">Business context</button>
  <button id="btn-memory">Memory</button>
  <button id="btn-clear">New conversation</button>
</header>

<div id="log"><div class="wrap" id="wrap"></div></div>

<footer>
  <form id="form">
    <textarea id="input" placeholder="Ask about events, properties, coverage…  (Enter to send)" autofocus></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</footer>

<dialog id="panel"><h3 id="panel-title"></h3><pre id="panel-body"></pre>
  <div style="margin-top:12px"><button onclick="panel.close()">Close</button></div>
</dialog>

<script>
const wrap = document.getElementById('wrap');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');
const panel = document.getElementById('panel');

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
function scroll() { const l = document.getElementById('log'); l.scrollTop = l.scrollHeight; }

function addMessage(who, label) {
  const m = el('div', 'msg ' + who);
  m.appendChild(el('div', 'who', label));
  const body = el('div', 'body');
  m.appendChild(body);
  wrap.appendChild(m);
  scroll();
  return { node: m, body };
}

async function loadStatus() {
  try {
    const s = await (await fetch('/api/status')).json();
    const c = s.context_stats || {};
    const ctx = (c.organization || c.project)
      ? `context ${((c.organization||0)+(c.project||0)).toLocaleString()} chars` : 'no context';
    document.getElementById('meta').textContent =
      `project ${s.project_id} · workspace ${s.workspace_id} · ${s.tools.length} tools · ${ctx} · ${s.memory_entries} memories`;
  } catch { document.getElementById('meta').textContent = 'status unavailable'; }
}

function showApproval(ev, container) {
  const box = el('div', 'approval');
  box.appendChild(el('h3', null, 'Mixpanel write requested'));

  const t = el('table');
  const row = (k, v, danger) => {
    const tr = el('tr');
    tr.appendChild(el('td', 'k', k));
    const td = el('td', danger ? 'danger' : null, v);
    tr.appendChild(td);
    t.appendChild(tr);
  };
  row('tool', ev.tool);
  row('event', ev.event_name ?? '—');
  for (const [k, v] of Object.entries(ev.fields || {})) {
    const danger = (k === 'dropped' && v === true);
    row(k, JSON.stringify(v) + (danger ? '   ← STOPS INGESTION, LOSES DATA' : ''), danger);
  }
  box.appendChild(t);

  const actions = el('div', 'actions');
  const yes = el('button', 'yes', 'Approve');
  const no = el('button', 'no', 'Deny');
  actions.appendChild(yes); actions.appendChild(no);
  box.appendChild(actions);
  container.appendChild(box);
  scroll();

  const settle = async (approved) => {
    yes.disabled = no.disabled = true;
    box.classList.add('settled');
    actions.replaceWith(el('div', 'result', approved ? '✓ approved' : '✕ denied — nothing was changed'));
    try {
      await fetch('/api/approve', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ id: ev.id, approved })
      });
    } catch (e) { container.appendChild(el('div', 'result err', 'Could not send decision: ' + e)); }
  };
  yes.onclick = () => settle(true);
  no.onclick = () => settle(false);
}

async function ask(question) {
  addMessage('user', 'you').body.textContent = question;
  const agent = addMessage('agent', 'agent');
  let textNode = null;

  send.disabled = true;
  try {
    const res = await fetch('/api/ask', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ question })
    });
    if (!res.ok) {
      agent.body.appendChild(el('div', 'err', 'Error: ' + (await res.text())));
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split('\n\n');
      buffer = parts.pop();

      for (const part of parts) {
        const line = part.replace(/^data: /, '').trim();
        if (!line) continue;
        let ev; try { ev = JSON.parse(line); } catch { continue; }

        if (ev.type === 'text') {
          if (!textNode) { textNode = el('div'); agent.body.appendChild(textNode); }
          textNode.textContent += ev.text;
          scroll();
        } else if (ev.type === 'tool') {
          agent.body.appendChild(el('div', 'tool', '→ ' + ev.name));
          textNode = null;
          scroll();
        } else if (ev.type === 'approval_request') {
          showApproval(ev, agent.body);
          textNode = null;
        } else if (ev.type === 'approval_timeout') {
          agent.body.appendChild(el('div', 'result err', 'Approval timed out — treated as denied.'));
        } else if (ev.type === 'result') {
          const bits = [];
          if (ev.turns) bits.push(ev.turns + ' turns');
          if (ev.cost_usd != null) bits.push('$' + ev.cost_usd.toFixed(4));
          if (bits.length) agent.body.appendChild(el('div', 'result', bits.join(' · ')));
          if (ev.is_error) agent.body.appendChild(el('div', 'result err', 'Run ended with an error: ' + (ev.detail || '')));
        } else if (ev.type === 'error') {
          agent.body.appendChild(el('div', 'result err', ev.message));
        }
      }
    }
  } catch (e) {
    agent.body.appendChild(el('div', 'result err', String(e)));
  } finally {
    send.disabled = false;
    input.focus();
    loadStatus();
  }
}

form.onsubmit = (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q || send.disabled) return;
  input.value = '';
  ask(q);
};
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});

async function showPanel(title, url, key) {
  const d = await (await fetch(url)).json();
  document.getElementById('panel-title').textContent = title;
  document.getElementById('panel-body').textContent = d[key] || '(empty)';
  panel.showModal();
}
document.getElementById('btn-context').onclick = () => showPanel('Business context', '/api/context', 'markdown');
document.getElementById('btn-memory').onclick = () => showPanel('Memory', '/api/memory', 'markdown');
document.getElementById('btn-clear').onclick = async () => {
  await fetch('/api/clear', { method: 'POST' });
  wrap.innerHTML = '';
  loadStatus();
};

loadStatus();
</script>
</body>
</html>
